<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CaféTV – TV en vivo</title>
<style>
:root{--bg:#0d0f14;--panel:#171a22;--card:#1f2330;--txt:#eef1f7;--mut:#9aa3b5;--acc:#f0a23b;--foc:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;padding:18px 3vw;background:var(--panel)}
header h1{margin:0 18px 0 0;font-size:28px;color:var(--acc);white-space:nowrap}
.btn,.inp{background:var(--card);color:var(--txt);border:3px solid transparent;border-radius:12px;padding:12px 20px;font-size:20px;outline:none;cursor:pointer;white-space:nowrap}
.inp{flex:1;min-width:120px}
.btn.on{background:var(--acc);color:#111}
header>*{margin-right:14px}
#chips{display:flex;overflow-x:auto;overflow-y:hidden;padding:12px 3vw 4px;white-space:nowrap;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips .btn{margin-right:12px;padding:10px 18px;font-size:19px;flex:0 0 auto}
.focus{border-color:var(--foc)!important;transform:scale(1.06);box-shadow:0 0 0 4px rgba(240,162,59,.55)}
#status{padding:8px 3vw;color:var(--mut);font-size:18px}
#grid{flex:1;overflow-y:auto;padding:10px 3vw 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px;align-content:start}
.card{background:var(--card);border:3px solid transparent;border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:transform .12s;position:relative}
.card img{width:150px;height:84px;object-fit:contain}
.card .ph{width:150px;height:84px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:var(--acc)}
.card .nm{font-size:18px;text-align:center;line-height:1.2;max-height:2.4em;overflow:hidden}
.card .ct{font-size:14px;color:var(--mut)}
.card .fav{position:absolute;top:8px;right:12px;color:var(--acc);font-size:22px}
#more{grid-column:1/-1;justify-self:center}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:20}
.modal .box{background:var(--panel);border-radius:18px;padding:24px;width:min(560px,90vw);max-height:86vh;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font-size:26px}
.modal .list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px}
.modal .list .btn{text-align:left}
#player{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;display:none;z-index:30}
#player video{position:absolute;top:0;left:0;width:100%;height:100%;background:#000;object-fit:contain}
#osd{position:absolute;left:0;right:0;bottom:0;padding:28px 4vw;background:linear-gradient(transparent,rgba(0,0,0,.92));display:flex;align-items:center;gap:20px;transition:opacity .3s}
#osd img{width:120px;height:68px;object-fit:contain}
#osd .t{flex:1}
#osd .t b{font-size:30px;display:block}
#osd .t span{color:var(--mut);font-size:18px}
#msg{position:absolute;top:38%;left:10%;right:10%;text-align:center;font-size:34px;color:#fff;text-shadow:0 2px 6px #000;pointer-events:none}
.hide{opacity:0;pointer-events:none}
#ban{position:absolute;top:30px;left:40px;background:rgba(0,0,0,.72);padding:14px 26px;border-radius:14px;font-size:30px;transition:opacity .3s;border-left:6px solid var(--acc)}
#ban small{display:block;font-size:18px;color:var(--mut);margin-top:4px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>📺 CaféTV</h1>
    <input id="q" class="inp" data-nav placeholder="Buscar canal…" autocomplete="off">
    <button class="btn" data-nav id="bCountry">🌎 País: Todos</button>
    <button class="btn" data-nav id="bCat">🎬 Categoría: Todas</button>
    <button class="btn" data-nav id="bFav">★ Favoritos</button>
    <button class="btn" data-nav id="bReload">⟳</button>
  </header>
  <div id="dbg" style="position:fixed;right:12px;bottom:8px;color:#556;font-size:14px;z-index:50"></div>
  <div id="chips"></div>
  <div id="status">Cargando la lista más reciente de GitHub (iptv-org)…</div>
  <div id="grid"></div>
</div>

<div class="modal" id="modal"><div class="box"><h2 id="mTitle"></h2><div class="list" id="mList"></div></div></div>

<div id="player">
  <video id="video" autoplay playsinline></video>
  <div id="msg"></div>
  <div id="ban" class="hide"></div>
  <div id="osd">
    <img id="oLogo" alt="">
    <div class="t"><b id="oName"></b><span id="oInfo"></span></div>
    <button class="btn" data-nav id="oFav">★ Favorito</button>
    <button class="btn" data-nav id="oSrc">⇄ Otra fuente</button>
    <button class="btn" data-nav id="oClose">✕ Salir</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
(function(){
var API='https://iptv-org.github.io/api/';
var M3U='https://iptv-org.github.io/iptv/index.m3u';
/* En una web https el navegador bloquea señales http; dentro de las apps (Fire TV / Samsung) se permiten todas */
var VERSION='2026.11.08b';
var PAGE=60, HTTPS_ONLY=location.protocol==='https:'&&!window.TV_APP&&!/[?&]app=1/.test(location.search);
/* Canales que siempre aparecen primero */
var FEATURED=[/^caracol tv/i,/^canal rcn/i,/^caracol internacional/i,/^canal 1$/i,/^se[ñn]al colombia/i,/^citytv/i,/^canal capital/i,/^teleantioquia/i,/^telecaf/i,/^telecaribe/i,/^telepac/i];
function rank(c){for(var i=0;i<FEATURED.length;i++)if(FEATURED[i].test(c.name)&&(!c.country||c.country==='CO'))return i;return 99}
var all=[],view=[],shown=0,countries={},cats={};
var st={country:'',cat:'',fav:false,q:''};
var noVid=null,watch=null,favs=load('favs',{}),hls=null,cur=-1,srcIdx=0,osdTimer=null,scope='main';
var $=function(id){return document.getElementById(id)};

function dbg(t){try{document.getElementById('dbg').textContent=t}catch(e){}}
function load(k,d){try{return JSON.parse(localStorage.getItem('tv_'+k))||d}catch(e){return d}}
function save(k,v){try{localStorage.setItem('tv_'+k,JSON.stringify(v))}catch(e){}}
function getJSON(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw r.status;return r.json()})}
function okUrl(u){return !HTTPS_ONLY||u.indexOf('https:')===0}

/* ---------- Carga de datos ---------- */
function loadAPI(){
  return Promise.all(['channels','streams','logos','countries','categories'].map(function(f){return getJSON(API+f+'.json')}))
  .then(function(r){
    var ch={},logos={},out={};
    r[0].forEach(function(c){ch[c.id]=c});
    r[2].forEach(function(l){if(!logos[l.channel]||!l.feed)logos[l.channel]=l.url});
    r[3].forEach(function(c){countries[c.code]=(c.flag?c.flag+' ':'')+c.name});
    r[4].forEach(function(c){cats[c.id]=c.name});
    r[1].forEach(function(s){
      if(!s.url||!okUrl(s.url))return;
      var c=s.channel&&ch[s.channel];
      if(c&&(c.is_nsfw||c.closed))return;
      var key=s.channel||s.title||s.url;
      var o=out[key];
      if(!o){o=out[key]={id:key,name:c?c.name:(s.title||'Canal'),logo:(c&&(c.logo||logos[c.id]))||'',country:c?c.country:'',cats:c?(c.categories||[]):[],streams:[]}}
      o.streams.push({url:s.url,q:s.quality||'',ref:s.referrer||'',ua:s.user_agent||''});
    });
    return Object.keys(out).map(function(k){return out[k]});
  });
}
function loadM3U(){
  return fetch(M3U,{cache:'no-cache'}).then(function(r){return r.text()}).then(function(t){
    var lines=t.split(/\r?\n/),out={},info=null;
    lines.forEach(function(l){
      if(l.indexOf('#EXTINF')===0){
        var a=function(n){var m=l.match(new RegExp(n+'="([^"]*)"'));return m?m[1]:''};
        var id=a('tvg-id'),cc=(id.split('@')[0].split('.')[1]||'').toUpperCase();
        info={id:id,name:l.split(',').pop().replace(/\s*\(\d+p\).*$/,'').trim(),logo:a('tvg-logo'),country:cc,
              cats:a('group-title').toLowerCase().split(';').filter(function(x){return x&&x!=='undefined'})};
      }else if(info&&l&&l[0]!=='#'){
        if(okUrl(l)){var k=(info.id||info.name).split('@')[0];
          if(!out[k]){out[k]=info;info.streams=[]}
          out[k].streams.push({url:l.trim(),q:'',ref:'',ua:''});}
        info=null;
      }
    });
    return Object.keys(out).map(function(k){return out[k]});
  });
}
function start(){
  $('status').textContent='Cargando la lista más reciente de GitHub (iptv-org)…';
  loadAPI().catch(function(){return loadM3U()}).then(function(list){
    list.sort(function(a,b){return (rank(a)-rank(b))||a.name.localeCompare(b.name)});
    all=list;
    var c=load('filters',null);if(c){st.country=c.country||'';st.cat=c.cat||''}
    apply();
  }).catch(function(){$('status').textContent='No se pudo descargar la lista. Revisa la conexión y pulsa ⟳.'});
}

/* ---------- Categorías por tipo ---------- */
var CAT_ES={general:'📺 General',news:'📰 Noticias',sports:'⚽ Deportes',movies:'🎬 Películas',series:'🎞️ Series',
  music:'🎵 Música',kids:'🧸 Infantil',entertainment:'🎭 Entretenimiento',documentary:'🦁 Documentales',comedy:'😂 Comedia',
  cooking:'🍳 Cocina',religious:'⛪ Religiosos',culture:'🎨 Cultura',education:'📚 Educación',lifestyle:'✨ Estilo de vida',
  travel:'✈️ Viajes',animation:'🐭 Animación',classic:'📼 Clásicos',business:'💼 Economía',auto:'🚗 Motor',
  outdoor:'🏕️ Aire libre',science:'🔬 Ciencia',weather:'🌦️ Clima',shop:'🛍️ Compras',family:'👪 Familia',
  legislative:'🏛️ Gobierno',relax:'🌿 Relax',public:'📡 Públicos',interactive:'🕹️ Interactivos'};
var CHIPS=['','CO','sports','news','movies','series','kids','music','entertainment','documentary','comedy','cooking','religious'];
function catName(k){return CAT_ES[k]||cats[k]||k}
function renderChips(){
  var html='';
  CHIPS.forEach(function(k){
    var on=k===''?(!st.cat&&!st.fav&&st.country!=='CO'):k==='CO'?st.country==='CO':st.cat===k;
    var label=k===''?'📺 Todos':k==='CO'?'🇨🇴 Colombia':catName(k);
    html+='<button class="btn chip'+(on?' on':'')+'" data-nav data-chip="'+k+'">'+esc(label)+'</button>';
  });
  html+='<button class="btn chip" data-nav data-chip="*">➕ Más categorías</button>';
  var fe=focused&&focused.getAttribute&&focused.getAttribute('data-chip');
  $('chips').innerHTML=html;
  if(fe!==null&&fe!==undefined){var n=$('chips').querySelector('[data-chip="'+fe+'"]');if(n)focus(n)}
}

/* ---------- Lista y filtros ---------- */
function apply(){
  var q=st.q.toLowerCase();
  view=all.filter(function(c){
    if(st.fav&&!favs[c.id])return false;
    if(st.country&&c.country!==st.country)return false;
    if(st.cat&&c.cats.indexOf(st.cat)<0)return false;
    if(q&&c.name.toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  $('bCountry').textContent='🌎 País: '+(st.country?(countries[st.country]||st.country):'Todos');
  $('bCat').textContent='🎬 Categoría: '+(st.cat?catName(st.cat):'Todas');
  $('bFav').className='btn'+(st.fav?' on':'');
  $('status').textContent=view.length+(view.length===1?' canal':' canales')+(st.cat?' · '+catName(st.cat):'')+' · lista actualizada desde github.com/iptv-org/iptv · v'+VERSION;
  save('filters',{country:st.country,cat:st.cat});
  renderChips();
  $('grid').innerHTML='';shown=0;more();
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function more(){
  var g=$('grid'),m=$('more');if(m)m.remove();
  var html='';
  view.slice(shown,shown+PAGE).forEach(function(c,i){
    var idx=shown+i;
    html+='<div class="card" data-nav data-i="'+idx+'">'+(favs[c.id]?'<span class="fav">★</span>':'')+
      (c.logo?'<img loading="lazy" src="'+esc(c.logo)+'" onerror="this.outerHTML=\'<div class=ph>'+esc(c.name.charAt(0))+'</div>\'">':'<div class="ph">'+esc(c.name.charAt(0))+'</div>')+
      '<div class="nm">'+esc(c.name)+'</div><div class="ct">'+esc(countries[c.country]||c.country||'')+'</div></div>';
  });
  g.insertAdjacentHTML('beforeend',html);
  shown=Math.min(shown+PAGE,view.length);
  if(shown<view.length)g.insertAdjacentHTML('beforeend','<button class="btn" data-nav id="more">Ver más canales ('+(view.length-shown)+')</button>');
}

/* ---------- Selector (país / categoría) ---------- */
var pick=null;
function openPicker(title,items,cb){
  $('mTitle').textContent=title;
  $('mList').innerHTML=items.map(function(it,i){return '<button class="btn" data-nav data-k="'+i+'">'+esc(it[1])+'</button>'}).join('');
  pick={items:items,cb:cb};$('modal').style.display='flex';scope='modal';focusFirst();
}
function closePicker(){$('modal').style.display='none';pick=null;scope='main';focus($('bCountry'))}
function countryItems(){
  var n={};all.forEach(function(c){if(c.country)n[c.country]=(n[c.country]||0)+1});
  var arr=Object.keys(n).map(function(k){return[k,(countries[k]||k)+' ('+n[k]+')']});
  arr.sort(function(a,b){return a[1].localeCompare(b[1])});
  ['CO','MX','AR','ES','US','VE','PE','EC','CL'].reverse().forEach(function(k){var i=arr.findIndex(function(x){return x[0]===k});if(i>0)arr.unshift(arr.splice(i,1)[0])});
  return[['','Todos los países']].concat(arr);
}
function catItems(){
  var n={};all.forEach(function(c){c.cats.forEach(function(k){n[k]=(n[k]||0)+1})});
  var arr=Object.keys(n).map(function(k){return[k,catName(k)+' ('+n[k]+')']});
  arr.sort(function(a,b){return a[1].localeCompare(b[1])});
  return[['','Todas las categorías']].concat(arr);
}

/* ---------- Reproductor ---------- */
var openedAt=0,lastKey=0,lastOk=0;
var good=load('good',{}),probeTok=0,bad={};
/* Prueba varias fuentes a la vez y usa la primera que responda */
function pickSource(c,cb){
  var tok=++probeTok,done=false,pending=0,list=c.streams.slice(0,15),pref=good[c.id];
  function finish(idx){if(done||tok!==probeTok)return;done=true;cb(idx)}
  list.forEach(function(st,idx){
    if(bad[st.url])return;
    pending++;
    var ctl=window.AbortController?new AbortController():null;
    var to=setTimeout(function(){if(ctl)ctl.abort()},6000);
    fetch(st.url,{cache:'no-store',signal:ctl?ctl.signal:undefined}).then(function(r){
      if(!r.ok)throw 0;return r.text()}).then(function(t){
      clearTimeout(to);if(t.indexOf('#EXT')<0)throw 0;
      if(st.url===pref||!pref)finish(idx);else setTimeout(function(){finish(idx)},400);
    }).catch(function(){clearTimeout(to);if(--pending===0)finish(-1)});
  });
  if(!pending)finish(-1);
  setTimeout(function(){finish(-1)},7000);
}
function play(i,s){
  if(i<0)i=view.length-1;if(i>=view.length)i=0;
  var c=view[i];if(!c)return;
  if(s===undefined&&c.streams.length>1){
    cur=i;srcIdx=0;if(scope!=='player')openedAt=Date.now();
    $('player').style.display='block';scope='player';banner(i);$('osd').classList.add('hide');
    if(hls){hls.destroy();hls=null}var vv=$('video');vv.removeAttribute('src');
    var slow=setTimeout(function(){msg('Buscando la mejor señal…')},1200);
    pickSource(c,function(idx){clearTimeout(slow);if(cur!==i||scope!=='player')return;play(i,idx<0?0:idx)});
    return;
  }
  cur=i;srcIdx=s||0;
  var st_=c.streams[srcIdx],v=$('video');
  if(scope!=='player')openedAt=Date.now();
  $('player').style.display='block';scope='player';
  $('oLogo').src=c.logo||'';$('oName').textContent=c.name;
  $('oInfo').textContent=(countries[c.country]||c.country||'')+' · Fuente '+(srcIdx+1)+' de '+c.streams.length+(st_.q?' · '+st_.q:'')+' · ▲▼ cambiar canal';
  $('oFav').textContent=favs[c.id]?'★ Quitar favorito':'☆ Favorito';
  msg('');banner(i);$('osd').classList.add('hide');save('last',c.id);
  clearTimeout(watch);watch=setTimeout(function(){if(v.readyState<3)fail()},15000);
  /* si a los 8 s hay sonido pero no imagen (pantalla negra), prueba otra fuente */
  clearTimeout(noVid);noVid=setTimeout(function(){if(scope==='player'&&v.readyState>=2&&!v.videoWidth){bad[st_.url]=1;msg('Sin imagen en esta fuente, probando otra…');fail()}},8000);
  if(hls){hls.destroy();hls=null}
  v.removeAttribute('src');
  if(window.Hls&&Hls.isSupported()){
    /* Arranque rápido (cerca del directo) y búfer que crece hasta 30 s mientras se ve */
    hls=new Hls({liveSyncDurationCount:3,maxBufferLength:30,maxMaxBufferLength:60,
      backBufferLength:30,manifestLoadingTimeOut:8000,manifestLoadingMaxRetry:1,levelLoadingMaxRetry:2,
      fragLoadingMaxRetry:4,fragLoadingRetryDelay:1000,startFragPrefetch:true});
    var recovered=false;
    hls.on(Hls.Events.ERROR,function(e,d){
      if(!d.fatal)return;
      if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&!recovered){recovered=true;hls.recoverMediaError();return}
      msg('Fuente '+(srcIdx+1)+' no responde ('+(d.details||d.type)+')');fail()});
    hls.loadSource(st_.url);hls.attachMedia(v);
  }else{v.src=st_.url}
  v.play().catch(function(){});
}
function fail(){
  clearTimeout(watch);clearTimeout(noVid);var cc=view[cur];if(cc&&cc.streams[srcIdx])bad[cc.streams[srcIdx].url]=1;if($('player').style.display!=='block')return;
  var c=view[cur];
  var nx=srcIdx+1;while(c&&nx<c.streams.length&&bad[c.streams[nx].url])nx++;
  if(c&&nx<c.streams.length){msg('Probando fuente '+(nx+1)+' de '+c.streams.length+'…');play(cur,nx)}
  else msg('Este canal no está disponible ahora. Usa ▲▼ para cambiar.');
}
function msg(t){$('msg').textContent=t||''}
function stop(){clearTimeout(watch);clearTimeout(noVid);probeTok++;clearTimeout(zapT);zapI=-1;$('ban').classList.add('hide');if(hls){hls.destroy();hls=null}var v=$('video');v.pause();v.removeAttribute('src');v.load();
  $('player').style.display='none';scope='main';
  var el=document.querySelector('.card[data-i="'+cur+'"]');focus(el||$('q'));if(el)el.scrollIntoView({block:'center'})}
function showOSD(){$('osd').classList.remove('hide');if(!focused||!$('osd').contains(focused))focus($('oSrc'));clearTimeout(osdTimer);osdTimer=setTimeout(function(){$('osd').classList.add('hide')},5000)}
function toggleFav(c){if(favs[c.id])delete favs[c.id];else favs[c.id]=1;save('favs',favs)}
$('video').addEventListener('playing',function(){msg('');clearTimeout(watch);var c=view[cur],v=$('video');if(c&&c.streams[srcIdx]&&v.videoWidth&&good[c.id]!==c.streams[srcIdx].url){good[c.id]=c.streams[srcIdx].url;save('good',good)}});
/* Solo avisa si la señal se detiene más de 3 s */
var stallT=null;
$('video').addEventListener('waiting',function(){clearTimeout(stallT);stallT=setTimeout(function(){if(scope==='player')msg('Cargando…')},3000)});
$('video').addEventListener('timeupdate',function(){clearTimeout(stallT);if($('msg').textContent==='Cargando…')msg('')});
/* Cartel con el nombre del canal (arriba a la izquierda) */
var banT=null;
function banner(i){var c=view[i];if(!c)return;var b=$('ban');
  b.innerHTML=esc(c.name)+'<small>'+(i+1)+' de '+view.length+' · ▲▼ cambiar canal · OK menú</small>';
  b.classList.remove('hide');clearTimeout(banT);banT=setTimeout(function(){b.classList.add('hide')},3500)}
/* Zapping: muestra el nombre al instante y cambia cuando dejas de pulsar */
var zapI=-1,zapT=null;
function zap(d){var n=view.length;if(!n)return;zapI=((zapI<0?cur:zapI)+d+n)%n;banner(zapI);
  clearTimeout(zapT);zapT=setTimeout(function(){var i=zapI;zapI=-1;play(i)},450)}
$('video').addEventListener('error',fail);

/* ---------- Navegación con control remoto ---------- */
var focused=null;
function focus(el){if(!el)return;if(focused)focused.classList.remove('focus');focused=el;el.classList.add('focus');
  if(el.tagName==='INPUT')el.focus();else{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
  el.scrollIntoView({block:'nearest',inline:'nearest'})}
function scopeEl(){return scope==='modal'?$('modal'):scope==='player'?$('osd'):$('app')}
function focusFirst(){var e=scopeEl().querySelector('[data-nav]');focus(e)}
function move(dir){
  var els=[].slice.call(scopeEl().querySelectorAll('[data-nav]'));
  if(!focused||els.indexOf(focused)<0)return focusFirst();
  var a=focused.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2,best=null,bd=1e9;
  els.forEach(function(e){if(e===focused)return;var b=e.getBoundingClientRect(),bx=b.left+b.width/2,by=b.top+b.height/2,dx=bx-ax,dy=by-ay,d;
    if(dir==='l'&&dx>=-2)return;if(dir==='r'&&dx<=2)return;if(dir==='u'&&dy>=-2)return;if(dir==='d'&&dy<=2)return;
    d=(dir==='l'||dir==='r')?Math.abs(dx)+Math.abs(dy)*3:Math.abs(dy)+Math.abs(dx)*0.6;
    if(d<bd){bd=d;best=e}});
  if(best){focus(best);if(best.id==='more'){/* auto-cargar */}}
}
function activate(el){
  if(!el)return;
  if(el.classList.contains('card'))return play(+el.getAttribute('data-i'));
  if(el.id==='more'){var n=shown;more();focus(document.querySelector('.card[data-i="'+n+'"]'));return}
  if(el.hasAttribute&&el.hasAttribute('data-chip')){var k=el.getAttribute('data-chip');
    if(k==='*')return openPicker('Elige una categoría',catItems(),function(x){st.cat=x;apply()});
    if(k===''){st.cat='';st.fav=false;st.country=''}
    else if(k==='CO')st.country=(st.country==='CO'?'':'CO');
    else st.cat=(st.cat===k?'':k);
    return apply()}
  if(scope==='modal'){var it=pick.items[+el.getAttribute('data-k')],cb=pick.cb;closePicker();cb(it[0]);return}
  switch(el.id){
    case 'bCountry':return openPicker('Elige un país',countryItems(),function(k){st.country=k;apply()});
    case 'bCat':return openPicker('Elige una categoría',catItems(),function(k){st.cat=k;apply()});
    case 'bFav':st.fav=!st.fav;return apply();
    case 'bReload':return start();
    case 'oClose':return stop();
    case 'oSrc':var c=view[cur];return play(cur,(srcIdx+1)%c.streams.length);
    case 'oFav':toggleFav(view[cur]);$('oFav').textContent=favs[view[cur].id]?'★ Quitar favorito':'☆ Favorito';showOSD();focus($('oFav'));return;
    case 'q':return el.focus();
  }
}
function back(){
  if(scope==='modal'){closePicker();return true}
  if(scope==='player'){if($('osd').classList.contains('hide'))stop();else $('osd').classList.add('hide');return true}
  if(st.q||st.fav||st.country||st.cat){st.q='';$('q').value='';st.fav=false;st.country='';st.cat='';apply();focus($('q'));return true}
  try{if(window.tizen){tizen.application.getCurrentApplication().exit();return true}}catch(e){}
  return false;
}
/* Llamado por la app Android (Fire TV) al pulsar Atrás; false = salir de la app */
window.tvBack=back;
var KEYS={37:'l',38:'u',39:'r',40:'d',13:'ok',10009:'back',27:'back',8:'back',4:'back',427:'chup',428:'chdn',33:'chup',34:'chdn',403:'fav',415:'ok',179:'ok'};
try{if(window.tizen&&tizen.tvinputdevice)['ChannelUp','ChannelDown','ColorF0Red','MediaPlayPause','MediaPlay'].forEach(function(k){try{tizen.tvinputdevice.registerKey(k)}catch(e){}})}catch(e){}
document.addEventListener('keydown',function(e){
  dbg('tecla '+e.keyCode+(e.key?' '+e.key:''));
  var k=KEYS[e.keyCode]||(e.key==='Enter'||e.key==='Accept'||e.keyCode===65376||e.keyCode===29443?'ok':null);if(!k)return;
  lastKey=Date.now();
  if(e.repeat&&(k==='ok'||k==='back')){e.preventDefault();return}
  if(k==='ok'&&Date.now()-openedAt<900){e.preventDefault();return}
  var typing=document.activeElement&&document.activeElement.tagName==='INPUT';
  if(typing){var inp=document.activeElement,pos=inp.selectionStart,len=inp.value.length;
    if(k==='back'&&e.keyCode===8)return;
    if(k==='l'&&pos>0)return;
    if(k==='r'&&pos<len)return;}
  e.preventDefault();
  if(scope==='player'){
    var hidden=$('osd').classList.contains('hide');
    if(k==='u'||k==='chup')return zap(-1);
    if(k==='d'||k==='chdn')return zap(1);
    if(k==='back')return back();
    if(hidden){if(k==='ok')showOSD();return}
    showOSD();
    if(k==='l'||k==='r')return move(k);
  }
  if(k==='back')return back();
  if(k==='ok'){lastOk=Date.now();return activate(focused)}
  if(k==='fav'&&focused&&focused.classList.contains('card')){toggleFav(view[+focused.getAttribute('data-i')]);var i=+focused.getAttribute('data-i');apply();return}
  if(k==='l'||k==='r'||k==='u'||k==='d')move(k);
});
/* Solo clics reales de mouse/táctil (los TV generan clics falsos al pulsar OK) */
document.addEventListener('click',function(e){
  dbg('clic '+(e.target&&(e.target.id||e.target.className||e.target.tagName)));
  if(Date.now()-lastOk<700||Date.now()-openedAt<900)return;  /* ya se manejó con la tecla OK */
  var el=e.target.closest&&e.target.closest('[data-nav]');
  if(!el&&!e.detail)el=focused;                                 /* clic generado por el control remoto */
  if(el){focus(el);activate(el)}});
document.addEventListener('keyup',function(e){if((e.keyCode===13||e.key==='Enter')&&Date.now()-lastOk>700&&Date.now()-openedAt>900&&scope!=='player'){dbg('ok por keyup');lastOk=Date.now();activate(focused)}});
window.onerror=function(m){try{if(scope==='player')msg('Error: '+m);else $('status').textContent='Error: '+m}catch(x){}};
$('player').addEventListener('mousemove',function(){if(scope==='player')showOSD()});
var t;$('q').addEventListener('input',function(){clearTimeout(t);t=setTimeout(function(){st.q=$('q').value;apply()},350)});
$('grid').addEventListener('scroll',function(){var g=$('grid');if(g.scrollTop+g.clientHeight>g.scrollHeight-300&&shown<view.length)more()});

focus($('q'));start();
})();
</script>
