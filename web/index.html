<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CaféTV – TV en vivo</title>
<style>
/* ===== CaféTV · diseño moderno (compatible con TV antiguos: sin gap en flex, sin inset) ===== */
:root{--bg:#0a0c11;--panel:#12151d;--card:#171b25;--tile:#0f1219;--txt:#f3f5fa;--mut:#8f98ab;--acc:#f0a23b;--acc2:#ff7a45;--foc:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--txt);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden;
  background:#0a0c11;background:radial-gradient(1200px 600px at 85% -10%,#2a1c10 0%,rgba(10,12,17,0) 60%),#0a0c11}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;padding:16px 3vw 10px}
header>*{margin-right:12px}
header h1{margin:0 18px 0 0;font-size:30px;font-weight:800;letter-spacing:.5px;white-space:nowrap;color:var(--acc)}
header h1 span{color:var(--txt)}
.btn,.inp{background:rgba(255,255,255,.06);color:var(--txt);border:3px solid transparent;border-radius:999px;padding:11px 22px;font-size:19px;outline:none;cursor:pointer;white-space:nowrap}
.inp{flex:1;min-width:120px;border-radius:14px}
.btn.on{background:var(--acc);color:#16120b;font-weight:600}
.focus{border-color:var(--foc)!important;box-shadow:0 0 0 5px rgba(240,162,59,.45),0 10px 30px rgba(0,0,0,.6);-webkit-transform:scale(1.07);transform:scale(1.07);z-index:2}
#chips{display:flex;overflow-x:auto;overflow-y:hidden;padding:6px 3vw 6px;white-space:nowrap;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips .btn{margin-right:10px;padding:9px 18px;font-size:18px;flex:0 0 auto}
#status{padding:4px 3vw 2px;color:var(--mut);font-size:15px}
#grid{flex:1;overflow-y:auto;padding:14px 3vw 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));grid-gap:22px;gap:22px;align-content:start}
.card{background:var(--card);border:3px solid transparent;border-radius:18px;padding:0 0 12px;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;overflow:hidden;-webkit-transition:-webkit-transform .12s;transition:transform .12s}
.card img,.card .ph{width:100%;height:104px;object-fit:contain;padding:14px 22px;background:var(--tile);background:linear-gradient(160deg,#1d2230,#0f1219);margin-bottom:10px}
.card .ph{display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:var(--acc)}
.card .nm{font-size:17px;font-weight:600;text-align:center;line-height:1.2;max-height:2.4em;overflow:hidden;padding:0 10px}
.card .ct{font-size:13px;color:var(--mut);margin-top:4px}
.card .pg{font-size:13px;color:var(--acc);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:4px 10px 0}
.card .fav{position:absolute;top:8px;right:12px;color:var(--acc);font-size:22px;text-shadow:0 1px 4px #000}
.card.focus{background:#222838}
#more{grid-column:1/-1;justify-self:center}
/* inicio */
#home{flex:1;overflow-y:auto;padding:0 3vw 60px;display:none}
.hero{display:flex;align-items:center;margin:10px 0 6px;padding:26px 30px;border-radius:24px;background:#1a1410;background:linear-gradient(110deg,#2b1d10 0%,#171b25 55%,#11141c 100%);border:3px solid transparent}
.hero img,.hero .ph{width:210px;height:118px;object-fit:contain;margin-right:30px;background:rgba(0,0,0,.25);border-radius:16px;padding:12px}
.hero .ph{display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:800;color:var(--acc)}
.hero .tx{flex:1}
.hero small{color:var(--acc);font-size:16px;letter-spacing:1px;text-transform:uppercase}
.hero b{display:block;font-size:36px;margin:6px 0}
.hero span{color:var(--mut);font-size:19px}
.hero .go{margin-left:20px;background:var(--acc);color:#16120b;font-weight:700}
.row h2{font-size:23px;margin:18px 0 2px;font-weight:700}
.row h2 small{color:var(--mut);font-size:15px;font-weight:400}
.rowc{display:flex;overflow-x:auto;overflow-y:hidden;padding:12px 8px 16px;scrollbar-width:none}
.rowc::-webkit-scrollbar{display:none}
.rowc .card{flex:0 0 190px;width:190px;margin-right:18px}
.rowc .all{flex:0 0 150px;width:150px;margin-right:18px;justify-content:center;text-align:center;font-size:19px;color:var(--acc);padding:0}
/* selector */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:40}
.modal .box{background:var(--panel);border-radius:22px;padding:24px;width:560px;max-width:90vw;max-height:86vh;display:flex;flex-direction:column}
.modal h2{margin:0 0 12px;font-size:26px}
.modal .list{overflow-y:auto;display:flex;flex-direction:column;padding:6px}
.modal .list .btn{text-align:left;margin-bottom:8px;border-radius:14px}
/* reproductor */
#player{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;display:none;z-index:30}
#player video{position:absolute;top:0;left:0;width:100%;height:100%;background:#000;object-fit:contain}
#osd{position:absolute;left:0;right:0;bottom:0;padding:30px 4vw;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.94));display:flex;align-items:center;-webkit-transition:opacity .3s;transition:opacity .3s}
#osd>*{margin-right:16px}
#osd img{width:130px;height:74px;object-fit:contain}
#osd .t{flex:1}
#osd .t b{font-size:30px;display:block}
#osd .t span{color:var(--mut);font-size:18px}
#msg{position:absolute;top:38%;left:10%;right:10%;text-align:center;font-size:34px;color:#fff;text-shadow:0 2px 6px #000;pointer-events:none}
.hide{opacity:0;pointer-events:none}
#ban{position:absolute;top:30px;left:40px;max-width:60%;background:rgba(10,12,17,.82);padding:16px 28px;border-radius:18px;font-size:30px;font-weight:700;-webkit-transition:opacity .3s;transition:opacity .3s;border-left:6px solid var(--acc)}
#ban .pn{display:block;font-size:20px;font-weight:400;color:#ffd38a;margin-top:6px}
#ban .pb{height:6px;background:#3a4052;border-radius:3px;margin-top:8px;overflow:hidden}
#ban .pb i{display:block;height:100%;background:var(--acc)}
#ban small{display:block;font-size:17px;font-weight:400;color:var(--mut);margin-top:6px}
#guide{position:absolute;right:4vw;top:8%;width:40vw;max-height:70%;overflow:hidden;background:rgba(10,12,18,.95);border-radius:18px;padding:20px 24px;display:none}
#guide h3{margin:0 0 12px;font-size:26px}
#guide .r{display:flex;padding:8px 0;border-bottom:1px solid #2a2f3d;font-size:21px}
#guide .r b{width:120px;flex:0 0 120px;color:var(--mut);font-weight:400}
#guide .r.now{color:var(--acc)}
/* guía en grilla */
#gv{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0c11;display:none;z-index:25;flex-direction:column}
#gv .gh{display:flex;align-items:center;padding:18px 3vw 8px}
#gv .gh h2{margin:0;font-size:28px;flex:1}
#gv .gh span{color:var(--mut);font-size:17px}
#gv .tl{position:relative;height:30px;margin-left:calc(3vw + 270px);margin-right:3vw;overflow:hidden;color:var(--mut);font-size:15px}
#gv .tl i{position:absolute;top:4px;font-style:normal;border-left:1px solid #2a2f3d;padding-left:6px}
#gv .gb{flex:1;overflow-y:auto;padding:0 3vw 40px}
#gv .gr{display:flex;height:76px;margin-bottom:6px}
#gv .gc{flex:0 0 260px;width:260px;margin-right:10px;display:flex;align-items:center;background:var(--card);border-radius:12px;padding:0 12px;overflow:hidden}
#gv .gc img{width:70px;height:42px;object-fit:contain;margin-right:12px}
#gv .gc b{font-size:16px;line-height:1.2;max-height:2.4em;overflow:hidden}
#gv .gt{flex:1;position:relative;overflow:hidden}
#gv .gp{position:absolute;top:0;bottom:0;background:#1a1f2b;border:3px solid transparent;border-radius:10px;padding:8px 12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:17px;cursor:pointer}
#gv .gp small{display:block;color:var(--mut);font-size:13px;margin-top:4px}
#gv .gp.now{background:#2a2216;border-color:rgba(240,162,59,.35)}
#gv .gp.focus{-webkit-transform:none;transform:none;background:#3a2c18}
#gv .nl{position:absolute;top:0;bottom:0;width:2px;background:var(--acc2);z-index:3}
#gv .empty{color:var(--mut);font-size:22px;padding:40px 3vw}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>☕ Café<span>TV</span></h1>
    <input id="q" class="inp" data-nav placeholder="🔍 Buscar canal…" autocomplete="off">
    <button class="btn" data-nav id="bGuide">📅 Guía</button>
    <button class="btn" data-nav id="bCountry">🌎 País: Todos</button>
    <button class="btn" data-nav id="bCat">🎬 Categoría: Todas</button>
    <button class="btn" data-nav id="bFav">★ Favoritos</button>
    <button class="btn" data-nav id="bReload">⟳</button>
  </header>
  <div id="dbg" style="position:fixed;right:12px;bottom:8px;color:#556;font-size:14px;z-index:50"></div>
  <div id="chips"></div>
  <div id="status">Cargando la lista más reciente de GitHub (iptv-org)…</div>
  <div id="grid"></div>
  <div id="home"></div>
</div>

<div id="gv"><div class="gh"><h2>📅 Guía de programación</h2><span>▲▼ canales · ◀▶ horas · OK ver · Atrás salir</span></div><div class="tl" id="gvTl"></div><div class="gb" id="gvB"></div></div>

<div class="modal" id="modal"><div class="box"><h2 id="mTitle"></h2><div class="list" id="mList"></div></div></div>

<div id="player">
  <video id="video" autoplay playsinline></video>
  <div id="msg"></div>
  <div id="ban" class="hide"></div>
  <div id="guide"></div>
  <div id="osd">
    <img id="oLogo" alt="">
    <div class="t"><b id="oName"></b><span id="oInfo"></span></div>
    <button class="btn" data-nav id="oFav">★ Favorito</button>
    <button class="btn" data-nav id="oGuide">📅 Programación</button>
    <button class="btn" data-nav id="oSrc">⇄ Otra fuente</button>
    <button class="btn" data-nav id="oClose">✕ Salir</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
(function(){
var API='https://iptv-org.github.io/api/';
var M3U='https://iptv-org.github.io/iptv/index.m3u';
/* En una web https el navegador bloquea señales http; dentro de las apps (Fire TV / Samsung) se permiten todas */
var VERSION='2026.11.18c';
var PAGE=60, HTTPS_ONLY=location.protocol==='https:'&&!window.TV_APP&&!/[?&]app=1/.test(location.search);
/* Canales que siempre aparecen primero */
var FEATURED=[/^caracol tv/i,/^canal rcn/i,/^caracol internacional/i,/^canal 1$/i,/^se[ñn]al colombia/i,/^citytv/i,/^canal capital/i,/^teleantioquia/i,/^telecaf/i,/^telecaribe/i,/^telepac/i];
function rank(c){for(var i=0;i<FEATURED.length;i++)if(FEATURED[i].test(c.name)&&(!c.country||c.country==='CO'))return i;return 99}
var all=[],view=[],shown=0,countries={},cats={};
var st={country:'',cat:'',fav:false,q:'',mine:true},mine={},mineN=0;
var noVid=null,watch=null,favs=load('favs',{}),hls=null,cur=-1,srcIdx=0,osdTimer=null,scope='main';
var $=function(id){return document.getElementById(id)};

function dbg(t){try{document.getElementById('dbg').textContent=t}catch(e){}}
function load(k,d){try{return JSON.parse(localStorage.getItem('tv_'+k))||d}catch(e){return d}}
function save(k,v){try{localStorage.setItem('tv_'+k,JSON.stringify(v))}catch(e){}}
function getJSON(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw r.status;return r.json()})}
function okUrl(u){return !HTTPS_ONLY||u.indexOf('https:')===0}

/* ---------- Carga de datos ---------- */
function loadAPI(){
  return Promise.all(['channels','streams','logos','countries','categories','feeds'].map(function(f){return getJSON(API+f+'.json').catch(function(e){if(f==='feeds')return [];throw e})}))
  .then(function(r){
    var ch={},logos={},out={};
    r[0].forEach(function(c){ch[c.id]=c});
    r[2].forEach(function(l){if(!logos[l.channel]||!l.feed)logos[l.channel]=l.url});
    r[3].forEach(function(c){countries[c.code]=(c.flag?c.flag+' ':'')+c.name});
    r[4].forEach(function(c){cats[c.id]=c.name});
    var lang={};r[5].forEach(function(f){(f.languages||[]).forEach(function(l){(lang[f.channel]=lang[f.channel]||[]).push(l)})});
    r[1].forEach(function(s){
      if(!s.url||!okUrl(s.url))return;
      var c=s.channel&&ch[s.channel];
      if(c&&(c.is_nsfw||c.closed))return;
      var key=s.channel||s.title||s.url;
      var o=out[key];
      if(!o){o=out[key]={id:key,name:c?c.name:(s.title||'Canal'),logo:(c&&(c.logo||logos[c.id]))||'',country:c?c.country:'',cats:c?(c.categories||[]):[],lang:c?lang[c.id]:undefined,streams:[]}}
      var qh=parseInt(s.quality,10);if(qh&&qh<480)return; /* baja calidad */
      o.streams.push({url:s.url,q:s.quality||'',h:qh||0,ref:s.referrer||'',ua:s.user_agent||''});
    });
    return Object.keys(out).map(function(k){return out[k]}).filter(function(c){return c.streams.length});
  });
}
function loadM3U(){
  return fetch(M3U,{cache:'no-cache'}).then(function(r){return r.text()}).then(function(t){
    var lines=t.split(/\r?\n/),out={},info=null;
    lines.forEach(function(l){
      if(l.indexOf('#EXTINF')===0){
        var a=function(n){var m=l.match(new RegExp(n+'="([^"]*)"'));return m?m[1]:''};
        var id=a('tvg-id'),cc=(id.split('@')[0].split('.')[1]||'').toUpperCase();
        info={id:id,name:l.split(',').pop().replace(/\s*\(\d+p\).*$/,'').trim(),logo:a('tvg-logo'),country:cc,
              cats:a('group-title').toLowerCase().split(';').filter(function(x){return x&&x!=='undefined'})};
      }else if(info&&l&&l[0]!=='#'){
        if(okUrl(l)){var k=(info.id||info.name).split('@')[0];
          if(!out[k]){out[k]=info;info.streams=[]}
          out[k].streams.push({url:l.trim(),q:'',ref:'',ua:''});}
        info=null;
      }
    });
    return Object.keys(out).map(function(k){return out[k]});
  });
}
/* Copia local de Mi lista: la app abre al instante y se actualiza en segundo plano */
function snapshot(){try{
  var keep=all.filter(function(c){return mine[c.id]||favs[c.id]}).map(function(c){return {id:c.id,name:c.name,logo:c.logo,country:c.country,cats:c.cats,alive:c.alive,
    streams:c.streams.slice(0,8).map(function(x){return {url:x.url,h:x.h||0,q:x.q||'',official:x.official?1:0,ref:x.ref||'',ua:x.ua||''}})}});
  save('cache',{t:Date.now(),v:VERSION,list:keep,co:Object.keys(coIds)})}catch(e){}}
var fromCache=false;
function start(){
  var cc=load('cache',null);
  if(cc&&cc.list&&cc.list.length&&cc.v===VERSION&&!all.length){
    all=cc.list;mine={};all.forEach(function(c){mine[c.id]=1});coIds={};(cc.co||[]).forEach(function(id){coIds[id]=1});
    mineN=all.length;fromCache=true;
    var f=load('filters',null);if(f){st.country=f.country||'';st.cat=f.cat||''}
    apply();loadEPG();focusFirstCard();
  }
  if(!fromCache)$('status').textContent='Cargando la lista más reciente de GitHub (iptv-org)…';
  var coP=fetch(CO_M3U,{cache:'no-cache'}).then(function(r){return r.ok?r.text():''}).catch(function(){return ''});
  loadAPI().catch(function(){return loadM3U()}).then(function(list){return coP.then(function(t){mergeCO(list,t);return list})}).then(function(list){
    list.sort(function(a,b){return (rank(a)-rank(b))||a.name.localeCompare(b.name)});
    mergeExtra(list);var wasCache=fromCache;fromCache=false;
    all=list;mine=curate(list);mineN=Object.keys(mine).length;loadEPG();loadStatus();
    var c=load('filters',null);if(c){st.country=c.country||'';st.cat=c.cat||''}
    if(wasCache)refreshKeep();else{apply();focusFirstCard()}
    snapshot();
  }).catch(function(){if(!all.length)$('status').textContent='No se pudo descargar la lista. Revisa la conexión y pulsa ⟳.'});
}

/* ---------- Categorías por tipo ---------- */
var CAT_ES={general:'📺 General',news:'📰 Noticias',sports:'⚽ Deportes',movies:'🎬 Películas',series:'🎞️ Series',
  music:'🎵 Música',kids:'🧸 Infantil',entertainment:'🎭 Entretenimiento',documentary:'🦁 Documentales',comedy:'😂 Comedia',
  cooking:'🍳 Cocina',religious:'⛪ Religiosos',culture:'🎨 Cultura',education:'📚 Educación',lifestyle:'✨ Estilo de vida',
  travel:'✈️ Viajes',animation:'🐭 Animación',classic:'📼 Clásicos',business:'💼 Economía',auto:'🚗 Motor',
  outdoor:'🏕️ Aire libre',science:'🔬 Ciencia',weather:'🌦️ Clima',shop:'🛍️ Compras',family:'👪 Familia',
  legislative:'🏛️ Gobierno',relax:'🌿 Relax',public:'📡 Públicos',interactive:'🕹️ Interactivos'};
var CHIPS=['mine','CO','sports','news','movies','series','kids','music','entertainment','documentary','comedy','cooking'];
function catName(k){return CAT_ES[k]||cats[k]||k}
function renderChips(){
  var html='';
  CHIPS.forEach(function(k){
    var on=k==='mine'?(!st.cat&&!st.fav&&!st.country):k===''?!st.mine:k==='CO'?st.country==='CO':st.cat===k;
    var label=k==='mine'?'🎯 Mi lista ('+mineN+')':k==='CO'?'🇨🇴 Colombia':catName(k);
    html+='<button class="btn chip'+(on?' on':'')+'" data-nav data-chip="'+k+'">'+esc(label)+'</button>';
  });
  html+='<button class="btn chip" data-nav data-chip="*">➕ Más categorías</button>';
  var fe=focused&&focused.getAttribute&&focused.getAttribute('data-chip');
  $('chips').innerHTML=html;
  if(fe!==null&&fe!==undefined){var n=$('chips').querySelector('[data-chip="'+fe+'"]');if(n)focus(n)}
}

/* ---------- Mi lista: selección personalizada (~300 canales en español) ---------- */
var HIS=['CO','MX','AR','CL','PE','VE','EC','BO','PY','UY','CR','PA','DO','GT','HN','SV','NI','CU','PR','ES'];
var PRIO={CO:9,MX:7,ES:7,US:6,AR:6,CL:5,PE:5,VE:4,EC:4,PR:3,DO:3,CR:3,PA:3,UY:3,GT:2,HN:2,SV:2,BO:2,PY:2,NI:2,CU:2,DE:5,FR:5,UK:4};
var NOCAT=['religious','shop','legislative','xxx'];
/* Canales de pago: no se incluyen en Mi lista */
var PAGO=/(espn|dsports|directv|bein|fox sports|fox deportes|win sports|win\+|tnt|hbo|cinemax|star channel|star\+|disney|golf channel|eurosport|msg|tyc sports|l1 max|bicolor|universal|warner|axn|sony|amc|cinecanal|paramount|discovery|nat ?geo|national geographic|history|a&e|lifetime|cartoon|nickelodeon|nick jr|comedy central|mtv|tlc|animal planet|golden|de pel[ií]cula|tooncast|cartoonito|baby ?tv|tudn|gol ?tv|movistar|dazn|sky sports|fubo|cinelatino|claro cinema|film ?& ?arts|europa europa|^dhe$|^ifc$|az cinema|az corazon|az clic|studio)/i;
/* Canales regionales de España que no interesan */
var REGIONAL=/(canarias|catalu|m[aá]laga|andaluc|galicia|valencia|murcia|euskadi|asturias|arag[oó]n|baleares|extremadura|navarra|rioja|castilla|cantabria|sevilla|granada|alicante|tenerife)/i;
/* ✏️ Personalización: canales agregados o quitados a pedido (por id de iptv-org o por nombre) */
var AGREGAR=[];
/* Infantiles que se conservan */
var INFANTIL=['Bob Esponja','Bob Esponja Pantalones Cuadrados','Pluto TV Kids','Pluto TV Junior','Pluto TV Kids Classics','Pluto TV Toons',
  'Clan','Doraemon','El Chavo TV','Avatar: La Leyenda de Aang','Hey Arnold!','Rugrats','Mr Bean Animated','Detective Conan'];
var QUITAR=[];
var QUOTA={sports:45,news:30,movies:200,series:200,kids:25,animation:10,music:20,entertainment:30,documentary:15,comedy:8,
  cooking:4,lifestyle:6,travel:6,classic:6,science:4,auto:4,outdoor:4,culture:8};
var BIG=/^(telemundo|univisi[oó]n|unim[aá]s|las estrellas|canal 5|azteca (uno|7)|imagen (tv|televisi[oó]n)|la ?1|la ?2|antena 3|cuatro|telecinco|la ?sexta|telefe|el ?trece|am[eé]rica tv|tv p[uú]blica|chilevisi[oó]n|mega|canal 13|tvn|latina( tv)?|panamericana|atv|venevisi[oó]n|televen|globovisi[oó]n|ecuavisa|teleamazonas|tc televisi[oó]n|unitel|red uno|estrella tv|telesistema|nu9ve|tve internacional|24h|canal 24 horas|telemicro|antena latina)( hd| internacional)?$/i;
function isSpanish(c){return c.lang?c.lang.indexOf('spa')>=0:HIS.indexOf(c.country)>=0}

function norm(x){return String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
var extraIds={};
function mergeExtra(list){
  var by={};list.forEach(function(c){var k=norm(c.name);if(!by[k]||c.country==='CO')by[k]=c});
  EXTRA.forEach(function(e){if(!okUrl(e[1]))return;
    var k=norm(e[5]||e[0]),c=by[k]||by[norm(e[0])];
    if(!c){c={id:'x:'+norm(e[0]),name:e[0],logo:e[2],country:e[4],cats:[e[3]],lang:['spa'],streams:[]};list.push(c);by[norm(e[0])]=c}
    if(!c.logo&&e[2])c.logo=e[2];
    /* la señal del propio canal va primero */
    c.streams=c.streams.filter(function(x){return x.url!==e[1]});
    c.streams.unshift({url:e[1],q:'',h:0,ref:'',ua:'',official:true});
    extraIds[c.id]=1});
}
function curate(list){
  var pick={},sp=list.filter(function(c){return isSpanish(c)&&!PAGO.test(c.name)&&!(c.country!=='CO'&&REGIONAL.test(c.name))&&!c.cats.some(function(k){return NOCAT.indexOf(k)>=0})});
  sp.forEach(function(c){if(c.country==='CO'||BIG.test(c.name)||/(cine|pel[ií]cula|movie|film|cinema|novela)/i.test(c.name))pick[c.id]=1});

  Object.keys(QUOTA).forEach(function(cat){
    sp.filter(function(c){return !pick[c.id]&&c.cats.indexOf(cat)>=0})
      .sort(function(a,b){return score(b)-score(a)}).slice(0,QUOTA[cat])
      .forEach(function(c){pick[c.id]=1});
  });
  /* Noticias: solo las de Colombia. Infantil: solo los más conocidos */
  var kidSeen={};
  list.forEach(function(c){if(!pick[c.id])return;
    if(c.cats.indexOf('news')>=0&&c.country!=='CO')delete pick[c.id];
    else if(c.cats.indexOf('kids')>=0&&c.country!=='CO'){
      if(INFANTIL.indexOf(c.name)<0||kidSeen[c.name])delete pick[c.id];else kidSeen[c.name]=1}
  });
  list.forEach(function(c){
    if(extraIds[c.id])pick[c.id]=1;
    if(coIds[c.id]&&!PAGO.test(c.name))pick[c.id]=1;
    if(AGREGAR.indexOf(c.id)>=0||AGREGAR.indexOf(c.name)>=0)pick[c.id]=1;
    if(QUITAR.indexOf(c.id)>=0||QUITAR.indexOf(c.name)>=0)delete pick[c.id];
  });
  return pick;
}

function hhmm(m){var d=new Date(m*60000),h=d.getHours(),mi=d.getMinutes(),ap=h<12?'a. m.':'p. m.';h=h%12||12;return h+':'+(mi<10?'0':'')+mi+' '+ap}

  while(i<a.length&&a[i][1]<=n)i++;if(i>=a.length)return null;return a.slice(i)}
function nowNext(id){var p=progs(id);if(!p)return null;var n=Date.now()/60000;

function apply(){
  var q=st.q.toLowerCase();
  view=all.filter(function(c){
    if(st.fav&&!favs[c.id])return false;
    if(!mine[c.id]&&!favs[c.id])return false;
    /* los de Colombia no se ocultan: la comprobación se hace desde EE. UU. y algunos solo funcionan en Colombia */
    if(checked&&c.alive===false&&!favs[c.id]&&c.country!=='CO'&&!coIds[c.id])return false;
    if(!favs[c.id]&&!coIds[c.id]&&deadHere(c))return false; /* no funcionó en este TV */
    if(st.country&&c.country!==st.country)return false;
    if(st.cat&&c.cats.indexOf(st.cat)<0)return false;
    if(q&&c.name.toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  $('bCountry').textContent='🌎 País: '+(st.country?(countries[st.country]||st.country):'Todos');
  $('bCat').textContent='🎬 Categoría: '+(st.cat?catName(st.cat):'Todas');
  $('bFav').className='btn'+(st.fav?' on':'');
  $('status').textContent=view.length+(view.length===1?' canal':' canales')+' en Mi lista'+(checked?' · ✅ comprobados hace '+Math.max(1,Math.round(checked.age/60))+' h':'')+(st.cat?' · '+catName(st.cat):'')+' · lista actualizada desde github.com/iptv-org/iptv · v'+VERSION;

  g.insertAdjacentHTML('beforeend',html);
  shown=Math.min(shown+PAGE,view.length);
  if(shown<view.length)g.insertAdjacentHTML('beforeend','<button class="btn" data-nav id="more">Ver más canales ('+(view.length-shown)+')</button>');
}

/* ---------- Selector (país / categoría) ---------- */
var pick=null;
function openPicker(title,items,cb){
  $('mTitle').textContent=title;
  $('mList').innerHTML=items.map(function(it,i){return '<button class="btn" data-nav data-k="'+i+'">'+esc(it[1])+'</button>'}).join('');
  pick={items:items,cb:cb};$('modal').style.display='flex';scope='modal';focusFirst();
}
function closePicker(){$('modal').style.display='none';pick=null;scope='main';focus($('bCountry'))}
function countryItems(){
  var n={};all.filter(function(c){return mine[c.id]||favs[c.id]}).forEach(function(c){if(c.country)n[c.country]=(n[c.country]||0)+1});
  var arr=Object.keys(n).map(function(k){return[k,(countries[k]||k)+' ('+n[k]+')']});
  arr.sort(function(a,b){return a[1].localeCompare(b[1])});
  ['CO','MX','AR','ES','US','VE','PE','EC','CL'].reverse().forEach(function(k){var i=arr.findIndex(function(x){return x[0]===k});if(i>0)arr.unshift(arr.splice(i,1)[0])});
  return[['','Todos los países']].concat(arr);
}
function catItems(){
  var n={};all.filter(function(c){return mine[c.id]||favs[c.id]}).forEach(function(c){c.cats.forEach(function(k){n[k]=(n[k]||0)+1})});
  var arr=Object.keys(n).map(function(k){return[k,catName(k)+' ('+n[k]+')']});
  arr.sort(function(a,b){return a[1].localeCompare(b[1])});
  return[['','Todas las categorías']].concat(arr);
}

/* ---------- Reproductor ---------- */
var openedAt=0,lastKey=0,lastOk=0;
var good=load('good',{}),probeTok=0,bad={};
/* Fuentes que fallaron en ESTE televisor: se evitan durante 3 días */
var badTV=load('badtv',{});(function(){var n=Date.now();for(var u in badTV)if(n-badTV[u]>3*864e5)delete badTV[u];for(var k in badTV)bad[k]=1})();
function markBad(u){bad[u]=1;badTV[u]=Date.now();save('badtv',badTV)}
function deadHere(c){for(var i=0;i<c.streams.length;i++)if(!badTV[c.streams[i].url])return false;return true}
/* Prueba varias fuentes a la vez y usa la primera que responda */
function pickSource(c,cb){
  var tok=++probeTok,done=false,pending=0,list=c.streams.slice(0,15),pref=good[c.id];
  function finish(idx){if(done||tok!==probeTok)return;done=true;cb(idx)}
  list.forEach(function(st,idx){
    if(bad[st.url])return;
    pending++;
    var ctl=window.AbortController?new AbortController():null;
    var to=setTimeout(function(){if(ctl)ctl.abort()},6000);
    fetch(st.url,{cache:'no-store',signal:ctl?ctl.signal:undefined}).then(function(r){
      if(!r.ok)throw 0;return r.text()}).then(function(t){
      clearTimeout(to);if(t.indexOf('#EXT')<0)throw 0;
      if(st.url===pref||!pref)finish(idx);else setTimeout(function(){finish(idx)},400);
    }).catch(function(){clearTimeout(to);if(--pending===0)finish(-1)});
  });
  if(!pending)finish(-1);
  setTimeout(function(){finish(-1)},7000);
}
function play(i,s){
  if(i<0)i=view.length-1;if(i>=view.length)i=0;
  var c=view[i];if(!c)return;
  if(s===undefined&&c.streams.length>1){
    cur=i;srcIdx=0;if(scope!=='player')openedAt=Date.now();
    $('player').style.display='block';scope='player';banner(i);$('osd').classList.add('hide');
    if(hls){hls.destroy();hls=null}var vv=$('video');vv.removeAttribute('src');
    var slow=setTimeout(function(){msg('Buscando la mejor señal…')},1200);
    pickSource(c,function(idx){clearTimeout(slow);if(cur!==i||scope!=='player')return;play(i,idx<0?0:idx)});
    return;
  }
  cur=i;srcIdx=s||0;stalls=[];
  var st_=c.streams[srcIdx],v=$('video');
  if(scope!=='player')openedAt=Date.now();
  $('player').style.display='block';scope='player';
  $('oLogo').src=c.logo||'';$('oName').textContent=c.name;
  $('oInfo').textContent=(countries[c.country]||c.country||'')+' · Fuente '+(srcIdx+1)+' de '+c.streams.length+(st_.q?' · '+st_.q:'')+' · ▲▼ cambiar canal'+(epgLine(c.id)?' — '+epgLine(c.id):'');
  $('oFav').textContent=favs[c.id]?'★ Quitar favorito':'☆ Favorito';
  msg('');banner(i);$('osd').classList.add('hide');save('last',c.id);
  var rc=load('recent',[]).filter(function(x){return x!==c.id});rc.unshift(c.id);save('recent',rc.slice(0,12));
  clearTimeout(watch);watch=setTimeout(function(){if(v.readyState<3)fail()},15000);
  /* si a los 8 s hay sonido pero no imagen (pantalla negra), prueba otra fuente */
  clearTimeout(noVid);noVid=setTimeout(function(){if(scope==='player'&&v.readyState>=2&&!v.videoWidth){markBad(st_.url);msg('Sin imagen en esta fuente, probando otra…');fail()}},8000);
  if(hls){hls.destroy();hls=null}
  v.removeAttribute('src');
  if(window.Hls&&Hls.isSupported()){
    /* Arranque rápido (cerca del directo) y búfer que crece hasta 30 s mientras se ve */
    hls=new Hls({liveSyncDurationCount:4,maxBufferLength:30,maxMaxBufferLength:60,
      backBufferLength:30,manifestLoadingTimeOut:8000,manifestLoadingMaxRetry:1,levelLoadingMaxRetry:2,
      fragLoadingMaxRetry:4,fragLoadingRetryDelay:1000,startFragPrefetch:true});
    var recovered=false;
    hls.on(Hls.Events.ERROR,function(e,d){
      if(!d.fatal)return;
      if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&!recovered){recovered=true;hls.recoverMediaError();return}
      msg('Fuente '+(srcIdx+1)+' no responde ('+(d.details||d.type)+')');fail()});
    hls.loadSource(st_.url);hls.attachMedia(v);
  }else{v.src=st_.url}
  v.play().catch(function(){});
}
function fail(){
  clearTimeout(watch);clearTimeout(noVid);var cc=view[cur];if(cc&&cc.streams[srcIdx])markBad(cc.streams[srcIdx].url);if($('player').style.display!=='block')return;
  var c=view[cur];
  var nx=srcIdx+1;while(c&&nx<c.streams.length&&bad[c.streams[nx].url])nx++;
  if(c&&nx<c.streams.length){msg('Probando fuente '+(nx+1)+' de '+c.streams.length+'…');play(cur,nx)}
  else msg('Este canal no está disponible ahora. Usa ▲▼ para cambiar.');
}
function msg(t){$('msg').textContent=t||''}
function stop(){hideGuide();stalls=[];clearTimeout(stallLong);clearTimeout(watch);clearTimeout(noVid);probeTok++;clearTimeout(zapT);zapI=-1;$('ban').classList.add('hide');if(hls){hls.destroy();hls=null}var v=$('video');v.pause();v.removeAttribute('src');v.load();
  $('player').style.display='none';scope='main';
  if(pendingRefresh||homeMode()){pendingRefresh=false;var keepId=view[cur]&&view[cur].id;apply();for(var j=0;j<view.length;j++)if(view[j].id===keepId){cur=j;break}}
  var el=document.querySelector('.card[data-i="'+cur+'"]');focus(el||$('q'));if(el)el.scrollIntoView({block:'center'})}
function showOSD(){$('osd').classList.remove('hide');if(!focused||!$('osd').contains(focused))focus($('oSrc'));clearTimeout(osdTimer);osdTimer=setTimeout(function(){$('osd').classList.add('hide')},5000)}
function toggleFav(c){if(favs[c.id])delete favs[c.id];else favs[c.id]=1;save('favs',favs)}
$('video').addEventListener('playing',function(){msg('');clearTimeout(watch);var c=view[cur],v=$('video');if(c&&c.streams[srcIdx]&&v.videoWidth&&good[c.id]!==c.streams[srcIdx].url){good[c.id]=c.streams[srcIdx].url;save('good',good)}});
/* Solo avisa si la señal se detiene más de 3 s */
var stallT=null,stallLong=null,stalls=[];
$('video').addEventListener('waiting',function(){if(scope!=='player')return;
  clearTimeout(stallT);stallT=setTimeout(function(){if(scope==='player')msg('Cargando…')},3000);
  var v=$('video');if(v.currentTime<1)return; /* aún arrancando */
  var n=Date.now();stalls=stalls.filter(function(t){return n-t<120000});stalls.push(n);
  clearTimeout(stallLong);
  /* señal inestable: 3 cortes en 2 minutos o un corte de más de 10 s -> otra fuente */
  if(stalls.length>=3)return unstable();
  stallLong=setTimeout(function(){if(scope==='player'&&v.readyState<3)unstable()},10000)});
function unstable(){stalls=[];clearTimeout(stallLong);var c=view[cur];if(!c)return;
  if(c.streams.length>1){msg('Señal inestable, cambiando de fuente…');fail()}}
$('video').addEventListener('playing',function(){clearTimeout(stallLong)});
$('video').addEventListener('timeupdate',function(){clearTimeout(stallT);if($('msg').textContent==='Cargando…')msg('')});
/* Cartel con el nombre del canal (arriba a la izquierda) */
var banT=null;
function banner(i){var c=view[i];if(!c)return;var b=$('ban');
  var el=epgLine(c.id),nn=nowNext(c.id),pb='';if(nn&&nn.now){var t=Date.now()/60000,pc=Math.max(0,Math.min(100,(t-nn.now[0])/(nn.now[1]-nn.now[0])*100));pb='<div class="pb"><i style="width:'+pc.toFixed(0)+'%"></i></div>'}
  b.innerHTML=esc(c.name)+(el?'<span class="pn">'+esc(el)+'</span>'+pb:'')+'<small>'+(i+1)+' de '+view.length+' · ▲▼ cambiar canal · OK menú</small>';
  clearTimeout(banT);banT=setTimeout(function(){b.classList.add('hide')},el?6000:3500);b.classList.remove('hide');return;
  b.classList.remove('hide');clearTimeout(banT);banT=setTimeout(function(){b.classList.add('hide')},3500)}
/* Zapping: muestra el nombre al instante y cambia cuando dejas de pulsar */
var zapI=-1,zapT=null;
function zap(d){var n=view.length;if(!n)return;zapI=((zapI<0?cur:zapI)+d+n)%n;banner(zapI);
  clearTimeout(zapT);zapT=setTimeout(function(){var i=zapI;zapI=-1;play(i)},450)}
$('video').addEventListener('error',fail);

/* ---------- Navegación con control remoto ---------- */
var focused=null;
function focus(el){if(!el)return;if(focused)focused.classList.remove('focus');focused=el;el.classList.add('focus');
  if(el.tagName==='INPUT')el.focus();else{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
  el.scrollIntoView({block:'nearest',inline:'nearest'})}
function scopeEl(){return scope==='modal'?$('modal'):scope==='player'?$('osd'):scope==='gv'?$('gv'):$('app')}
function focusFirstCard(){if(scope!=='main')return;var e=document.querySelector('#home [data-nav],#grid .card');if(e)focus(e)}
/* ---------- Guía en grilla ---------- */
var GV_MIN=210;
function openGV(){
  var g=$('gv');g.style.display='flex';scope='gv';
  var nowM=Date.now()/60000,t0=Math.floor(nowM/30)*30,t1=t0+GV_MIN;
  var w=Math.max(400,$('gvB').clientWidth-270-parseInt(getComputedStyle($('gvB')).paddingLeft,10)*2),px=w/GV_MIN;
  var tl='';for(var t=t0;t<t1;t+=30)tl+='<i style="left:'+((t-t0)*px)+'px">'+hhmm(t)+'</i>';$('gvTl').innerHTML=tl;
  var html='',n=0;
  for(var i=0;i<view.length&&n<150;i++){var c=view[i],p=progs(c.id);if(!p)continue;n++;
    var blocks='';p.forEach(function(x){if(x[1]<=t0||x[0]>=t1)return;
      var a=Math.max(x[0],t0),b=Math.min(x[1],t1);
      blocks+='<div class="gp'+(x[0]<=nowM&&x[1]>nowM?' now':'')+'" data-nav data-g data-i="'+i+'" style="left:'+((a-t0)*px)+'px;width:'+Math.max(30,(b-a)*px-6)+'px">'+
        esc(x[2])+'<small>'+hhmm(x[0])+' – '+hhmm(x[1])+'</small></div>'});
    html+='<div class="gr"><div class="gc">'+(c.logo?'<img src="'+esc(c.logo)+'">':'')+'<b>'+esc(c.name)+'</b></div><div class="gt">'+blocks+
      '<div class="nl" style="left:'+((nowM-t0)*px)+'px"></div></div></div>'}
  $('gvB').innerHTML=n?html:'<div class="empty">📅 La programación todavía no está disponible.<br>Se descarga automáticamente varias veces al día; vuelve a intentarlo más tarde.</div>';
  $('gvB').scrollTop=0;var f=$('gvB').querySelector('.gp.now')||$('gvB').querySelector('.gp');if(f)focus(f);else focus(null);
}
function closeGV(){$('gv').style.display='none';scope='main';focus($('bGuide'))}
function focusFirst(){var e=scopeEl().querySelector('[data-nav]');focus(e)}
function move(dir){
  var els=[].slice.call(scopeEl().querySelectorAll('[data-nav]'));
  if(!focused||els.indexOf(focused)<0)return focusFirst();
  var a=focused.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2,best=null,bd=1e9;
  els.forEach(function(e){if(e===focused)return;var b=e.getBoundingClientRect(),bx=b.left+b.width/2,by=b.top+b.height/2,dx=bx-ax,dy=by-ay,d;
    if(dir==='l'&&dx>=-2)return;if(dir==='r'&&dx<=2)return;if(dir==='u'&&dy>=-2)return;if(dir==='d'&&dy<=2)return;
    d=(dir==='l'||dir==='r')?Math.abs(dx)+Math.abs(dy)*3:Math.abs(dy)+Math.abs(dx)*0.6;
    if(d<bd){bd=d;best=e}});
  if(best){focus(best);if(best.id==='more'){/* auto-cargar */}}
}
function activate(el){
  if(!el)return;
  if(el.hasAttribute&&el.hasAttribute('data-g')){closeGV();return play(+el.getAttribute('data-i'))}
  if(el.classList.contains('card')||el.classList.contains('hero'))return play(+el.getAttribute('data-i'));
  if(el.id==='more'){var n=shown;more();focus(document.querySelector('.card[data-i="'+n+'"]'));return}
  if(el.hasAttribute&&el.hasAttribute('data-row')){var r=el.getAttribute('data-row');
    if(r==='fav')st.fav=true;else if(r==='CO')st.country='CO';else if(r!=='recent')st.cat=r;
    apply();focus(document.querySelector('#grid .card'));return}
  if(el.hasAttribute&&el.hasAttribute('data-chip')){var k=el.getAttribute('data-chip');
    if(k==='*')return openPicker('Elige una categoría',catItems(),function(x){st.cat=x;apply()});
    if(k==='mine'){st.cat='';st.fav=false;st.country=''}
    else if(k==='CO')st.country=(st.country==='CO'?'':'CO');
    else st.cat=(st.cat===k?'':k);
    return apply()}
  if(scope==='modal'){var it=pick.items[+el.getAttribute('data-k')],cb=pick.cb;closePicker();cb(it[0]);return}
  switch(el.id){
    case 'bCountry':return openPicker('Elige un país',countryItems(),function(k){st.country=k;apply()});
    case 'bCat':return openPicker('Elige una categoría',catItems(),function(k){st.cat=k;apply()});
    case 'bFav':st.fav=!st.fav;return apply();
    case 'bGuide':return openGV();
    case 'bReload':badTV={};bad={};save('badtv',{});save('cache',null);all=[];return start(); /* vuelve a probar todo */
    case 'oClose':return stop();
    case 'oGuide':if($('guide').style.display==='block')hideGuide();else showGuide();showOSD();focus($('oGuide'));return;
    case 'oSrc':var c=view[cur];return play(cur,(srcIdx+1)%c.streams.length);
    case 'oFav':toggleFav(view[cur]);$('oFav').textContent=favs[view[cur].id]?'★ Quitar favorito':'☆ Favorito';showOSD();focus($('oFav'));return;
    case 'q':return el.focus();
  }
}
function back(){
  if(scope==='modal'){closePicker();return true}
  if(scope==='gv'){closeGV();return true}
  if(scope==='player'){if($('guide').style.display==='block')hideGuide();else if($('osd').classList.contains('hide'))stop();else $('osd').classList.add('hide');return true}
  if(st.q||st.fav||st.country||st.cat){st.q='';$('q').value='';st.fav=false;st.country='';st.cat='';apply();focus($('q'));return true}
  try{if(window.tizen){tizen.application.getCurrentApplication().exit();return true}}catch(e){}
  return false;
}
/* Llamado por la app Android (Fire TV) al pulsar Atrás; false = salir de la app */
window.tvBack=back;
window.cafetvCanales=function(){return all}; /* para diagnóstico */
var KEYS={37:'l',38:'u',39:'r',40:'d',13:'ok',10009:'back',27:'back',8:'back',4:'back',427:'chup',428:'chdn',33:'chup',34:'chdn',403:'fav',415:'ok',179:'ok'};
try{if(window.tizen&&tizen.tvinputdevice)['ChannelUp','ChannelDown','ColorF0Red','MediaPlayPause','MediaPlay'].forEach(function(k){try{tizen.tvinputdevice.registerKey(k)}catch(e){}})}catch(e){}
document.addEventListener('keydown',function(e){
  dbg('tecla '+e.keyCode+(e.key?' '+e.key:''));
  var k=KEYS[e.keyCode]||(e.key==='Enter'||e.key==='Accept'||e.keyCode===65376||e.keyCode===29443?'ok':null);if(!k)return;
  lastKey=Date.now();
  if(e.repeat&&(k==='ok'||k==='back')){e.preventDefault();return}
  if(k==='ok'&&Date.now()-openedAt<900){e.preventDefault();return}
  var typing=document.activeElement&&document.activeElement.tagName==='INPUT';
  if(typing){var inp=document.activeElement,pos=inp.selectionStart,len=inp.value.length;
    if(k==='back'&&e.keyCode===8)return;
    if(k==='l'&&pos>0)return;
    if(k==='r'&&pos<len)return;}
  e.preventDefault();
  if(scope==='player'){
    var hidden=$('osd').classList.contains('hide');
    if(k==='u'||k==='chup')return zap(-1);
    if(k==='d'||k==='chdn')return zap(1);
    if(k==='back')return back();
    if(hidden){if(k==='ok')showOSD();return}
    showOSD();
    if(k==='l'||k==='r')return move(k);
  }
  if(k==='back')return back();
  if(k==='ok'){lastOk=Date.now();return activate(focused)}
  if(k==='fav'&&focused&&focused.classList.contains('card')){toggleFav(view[+focused.getAttribute('data-i')]);var i=+focused.getAttribute('data-i');apply();return}
  if(k==='l'||k==='r'||k==='u'||k==='d')move(k);
});
/* Solo clics reales de mouse/táctil (los TV generan clics falsos al pulsar OK) */
document.addEventListener('click',function(e){
  dbg('clic '+(e.target&&(e.target.id||e.target.className||e.target.tagName)));
  if(Date.now()-lastOk<700||Date.now()-openedAt<900)return;  /* ya se manejó con la tecla OK */
  var el=e.target.closest&&e.target.closest('[data-nav]');
  if(!el&&!e.detail)el=focused;                                 /* clic generado por el control remoto */
  if(el){focus(el);activate(el)}});
document.addEventListener('keyup',function(e){if((e.keyCode===13||e.key==='Enter')&&Date.now()-lastOk>700&&Date.now()-openedAt>900&&scope!=='player'){dbg('ok por keyup');lastOk=Date.now();activate(focused)}});
window.onerror=function(m){try{if(scope==='player')msg('Error: '+m);else $('status').textContent='Error: '+m}catch(x){}};
$('player').addEventListener('mousemove',function(){if(scope==='player')showOSD()});
var t;$('q').addEventListener('input',function(){clearTimeout(t);t=setTimeout(function(){st.q=$('q').value;apply()},350)});
$('grid').addEventListener('scroll',function(){var g=$('grid');if(g.scrollTop+g.clientHeight>g.scrollHeight-300&&shown<view.length)more()});

focus($('q'));start();
})();
