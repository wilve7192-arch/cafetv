name: Programación (EPG) de CaféTV

on:
  schedule:
    - cron: '23 */6 * * *'   # cada 6 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar y convertir la programación
        run: |
          mkdir -p epg
          python3 scripts/epg_fetch.py epg/epg.json
      - name: Guardar en el repositorio
        run: |
          git config user.name "cafetv-bot"
          git config user.email "cafetv-bot@users.noreply.github.com"
          git add epg/epg.json
          git commit -m "Programación actualizada" || echo "sin cambios"
          git pull --rebase
          git push
